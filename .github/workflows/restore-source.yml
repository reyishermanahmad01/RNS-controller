name: Restore RNS Controller Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          set -e
          ZIP_FILE="RNS-FULL-SOURCE-CODE-FINAL.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP source tidak ditemukan!"
            exit 1
          fi

          mkdir -p /tmp/rns-source
          unzip -q "$ZIP_FILE" -d /tmp/rns-source

          if [ ! -f /tmp/rns-source/package.json ]; then
            echo "package.json tidak ditemukan!"
            exit 1
          fi

          rsync -a --exclude='.git' --exclude='.github' /tmp/rns-source/ ./

      - name: Commit restored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Restore RNS Controller source code"
            git push
          else
            echo "Tidak ada perubahan."
          fi
          
